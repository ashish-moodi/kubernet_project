apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-backend
  namespace: observability
  labels:
    release: kube-prometheus-stack
    app: backend

spec:
  namespaceSelector:
    matchNames:
      - platform

  selector:
    matchLabels:
      app: backend

  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http