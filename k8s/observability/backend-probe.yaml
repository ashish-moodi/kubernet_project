apiVersion: monitoring.coreos.com/v1
kind: Probe

metadata:
  name: backend-health-probe
  namespace: observability
  labels:
    release: kube-prometheus-stack

spec:
  jobName: backend-health
  interval: 30s
  scrapeTimeout: 10s
  module: http_2xx

  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    scheme: http
    path: /probe

  targets:
    staticConfig:
      static:
      - http://envoy-platform-platform-gateway-d3c09cb8.envoy-gateway-system.svc.cluster.local:9999/api/health
      labels:
        application: platform
        component: backend
        environment: dev