apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: platform
  labels:
    app: backend

spec:
  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: ghcr.io/ashish-moodi/platform-backend@sha256:c0f4196880d9985e111bc2b50eea87cb82e9f959c583ff6852cde400efb19a4c
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
              name: http

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          env:
            - name: PORT
              value: "3000"

            - name: NODE_ENV
              value: production

            - name: KEYCLOAK_ISSUER
              value: "http://localhost:8081/realms/platform"

            - name: KEYCLOAK_JWKS_URL
              value: "http://keycloak.keycloak.svc.cluster.local:8080/realms/platform/protocol/openid-connect/certs"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service

metadata:
  name: backend
  namespace: platform
  labels:
    app: backend

spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP