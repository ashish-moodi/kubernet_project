apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform-monitoring-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ashish-moodi/kubernet_project.git
    targetRevision: main
    path: k8s/observability

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true