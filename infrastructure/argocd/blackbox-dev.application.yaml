apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: blackbox-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: "11.24.0"

    helm:
      releaseName: blackbox-exporter

      valuesObject:
        fullnameOverride: blackbox-exporter

        replicas: 1

        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi

        config:
          modules:
            http_2xx:
              prober: http
              timeout: 5s
              http:
                method: GET
                preferred_ip_protocol: ip4

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true