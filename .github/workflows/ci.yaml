
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/backend/package-lock.json

      - name: Build frontend
        working-directory: app/frontend
        run: npm ci && npm run build

      - name: Build backend
        working-directory: app/backend
        run: npm ci && npm run build

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        component: [frontend, backend]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Enable multi-architecture builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push multi-platform image
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app/${{ matrix.component }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/platform-${{ matrix.component }}:${{ github.sha }}

      - uses: sigstore/cosign-installer@v4.0.0

      # Sign the exact image digest
      - name: Sign image with GitHub OIDC
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/platform-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Generate SBOM
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/platform-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          artifact-name: ${{ matrix.component }}-sbom.spdx.json
